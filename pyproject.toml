[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pygments-rosepinemoon"
version = "1.0"
description = "Rose Pine Moon Pygments style (used by the Beamer theme through minted)"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["pygments"]

[project.entry-points."pygments.styles"]
rosepinemoon = "rosepinemoon:RosePineMoonStyle"

[tool.setuptools]
py-modules = ["rosepinemoon"]
